<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  /* 页眉：与主页 css/style.css 同一套（sticky 深色条 + 圆头像 + 右侧导航） */
  .site-header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#161b22,#1d232c);border-bottom:1px solid #30363d;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .header-inner{width:min(1280px,calc(100% - 32px));min-height:60px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#f0f6fc}
  .brand-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;background:#0d1117;
    box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 0 3px rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.45);
    transition:transform .18s ease,box-shadow .18s ease}
  .brand:hover .brand-avatar{transform:scale(1.06);box-shadow:0 0 0 1px rgba(255,255,255,.32),0 0 0 3px rgba(9,105,218,.28),0 4px 12px rgba(0,0,0,.5)}
  .brand-name{font-weight:650;font-size:14px;letter-spacing:.2px}
  .brand-sub{color:#8b949e;font-size:12px;font-weight:500}
  .header-nav{margin-left:auto;display:flex;align-items:center;gap:22px}

  @media(max-width:700px){.header-inner{padding:9px 0}.header-nav{gap:14px}.header-nav a{font-size:13px}.brand-sub{display:none}}


:root{color-scheme:light;--bg:#f6f8fa;--bg-soft:#eef2f6;--panel:#ffffff;--panel2:#f8fafc;--line:#d0d7de;--line-light:#e6ebf0;--text:#1f2328;--text-2:#57606a;--muted:#6e7781;--accent:#0969da;--accent-strong:#0550ae;--accent-soft:#ddf4ff;--ok:#1a7f37;--ok-soft:#dafbe1;--warn:#bc4c00;--warn-soft:#fff1e5;--err:#cf222e;--err-soft:#ffebe9;--shadow-small:0 1px 2px rgba(31,35,40,.06);--shadow:0 3px 8px rgba(31,35,40,.08);--shadow-large:0 8px 24px rgba(31,35,40,.10);--radius-small:6px;--radius:10px;--radius-large:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.wrap{max-width:1220px;margin:auto;padding:28px 18px 84px}.title{font-size:26px;font-weight:750}.sub{color:var(--muted);margin:4px 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
label{display:block;color:var(--text-2);margin-bottom:6px;font-weight:650}
input[type=url],input[type=text],textarea{width:100%;padding:11px 12px;background:#ffffff;border:1px solid var(--line);border-radius:8px;color:var(--text);outline:0}
input:focus,textarea:focus{border-color:var(--accent)}.small{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:650}.btn:hover{background:var(--bg-soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.switch{display:inline-flex;align-items:center;gap:8px;margin:0;padding:7px 13px 7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font-weight:400;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.switch:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.switch input{width:15px;height:15px;margin:0;accent-color:var(--accent);cursor:pointer}
.switch:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.switch:has(input:checked) span{color:var(--accent-strong);font-weight:650}
/* 底栏：与主页同款（固定贴底、半透明 + 模糊，始终可见） */
.site-footer{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:12px max(20px,calc((100% - 1220px)/2 + 18px));background:rgba(246,248,250,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line-light);box-shadow:0 -1px 3px rgba(31,35,40,.04);color:var(--muted);font-size:12px}
.footer-links{display:flex;gap:18px}
.footer-links a{color:var(--text-2)}
.footer-links a:hover{color:var(--accent)}
@media (max-width:650px){.site-footer{flex-direction:column;gap:6px;text-align:center}}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:10px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:18px}
.time{font-variant-numeric:tabular-nums;color:var(--text)}.seek{width:100%;accent-color:var(--accent)}
.trackbox{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:10px}.track{display:grid;grid-template-columns:34px minmax(150px,1.2fr) minmax(190px,1.5fr) 96px 96px;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line-light)}.track:last-child{border-bottom:0}
.name,.url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.url{color:var(--muted);font-size:12px}
.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--bg-soft);color:var(--text-2)}.ok{color:var(--ok)}.err{color:var(--err)}
pre{margin:0;background:var(--bg);border:1px solid var(--line-light);border-radius:8px;padding:12px;min-height:130px;max-height:280px;overflow:auto;color:var(--text);white-space:pre-wrap}
.note{padding:10px 12px;border-radius:9px;background:var(--ok-soft);border:1px solid #a2d8b4;color:var(--ok)}
.note button{margin-left:10px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:inherit;font-size:15px;font-weight:700;line-height:1;cursor:pointer;opacity:.55}
.note button:hover{opacity:1;background:rgba(26,127,55,.12)}
.warn{padding:10px 12px;border-radius:9px;background:var(--warn-soft);border:1px solid #f0b98b;color:var(--warn)}
textarea#pasteJson{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:80px;resize:vertical;margin-top:12px}
</style>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" title="返回 Yuweisha 主页">
      <img class="brand-avatar" src="https://yuweisha.github.io/storage/mainpageheader.svg" alt="Yuweisha">
      <span class="brand-name">UMA Live Studio</span>

    <nav class="header-nav">

<div class="wrap">
  <div class="title">UMA Offline Mixer · 混音工具
</div>

  <div id="handoff" class="note" style="display:none"></div>

  <div class="card">
    <div class="grid">
      <div>
        <label>项目 JSON / Mixer API URL</label>
        <input id="projectUrl" type="url" placeholder="example.com">
      </div>

      <label class="switch" title="按 JSON 的 encoderDelaySamples / encoderPaddingSamples 裁掉编码器的头尾填充"><input id="trim" type="checkbox" checked><span>裁剪编码延迟/尾填充</span></label>
      <label class="switch" title="用 DynamicsCompressor（threshold -14 dB / knee 18 / ratio 3 / attack 10 ms / release 200 ms）"><input id="compress" type="checkbox" checked><span>压缩器</span></label>
    </div>

  </div>

  <div id="summary" class="card" style="display:none">
    <div class="stats">

      <div class="stat"><span>Loaded</span><b id="loaded">0 / 0</b></div>
      <div class="stat"><span>Balance</span><b id="balance">-</b></div>
    </div>
  </div>

  <div id="player" class="card" style="display:none">
    <div class="row" style="justify-content:space-between">
      <div class="time"><span id="current">00:00.000</span> / <span id="total">00:00.000</span></div>
      <span id="state" class="badge">ready</span>

    <input id="seek" class="seek" type="range" min="0" max="1" step="0.001" value="0" style="margin:13px 0">
    <div class="row">

      <button id="pause" class="btn">⏸ 暂停</button>

      <label class="switch"><input id="wav16" type="checkbox"><span>16-bit PCM（默认 32-bit float）</span></label>
      <span id="exportStatus" class="small"></span>
    </div>
  </div>

  <div id="tracksCard" class="card" style="display:none">
    <div style="font-weight:700;margin-bottom:10px">Resolved Tracks</div>
    <div id="tracks" class="trackbox"></div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:10px">Log</div>
    <pre id="log"></pre>

</div>

<script src="js/core.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const C=window.UmaCore;
const logEl=$("log");
let project=null, projectUrl="", baseUrl="";
let sampleRate=48000, durationSec=0, buffers=new Map();
let audioCtx=null, graph=[], masterGain=null, compressor=null;
let startedAt=0, pausedAt=0, raf=0;

function log(s){const t=new Date().toLocaleTimeString();logEl.textContent+="["+t+"] "+s+"\n";logEl.scrollTop=logEl.scrollHeight}
function fmt(x){x=Math.max(0,Number(x)||0);const m=Math.floor(x/60),s=x-m*60;return String(m).padStart(2,"0")+":"+s.toFixed(3).padStart(6,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

/* ---------- JSON 加载 ---------- */
function jsonAuto(raw){
  const cand=["utf-8","utf-16le","utf-16be","gb18030","big5","windows-1252","iso-8859-1"];
  if(raw[0]===0xEF&&raw[1]===0xBB&&raw[2]===0xBF)cand.unshift("utf-8");
  if(raw[0]===0xFF&&raw[1]===0xFE)cand.unshift("utf-16le");
  if(raw[0]===0xFE&&raw[1]===0xFF)cand.unshift("utf-16be");
  const seen=new Set();
  for(const enc of cand){
    if(seen.has(enc))continue;seen.add(enc);
    try{const t=new TextDecoder(enc,{fatal:true}).decode(raw);const o=JSON.parse(t);if(o&&typeof o==="object")return{obj:o,enc}}catch{}
  }
  throw new Error("JSON 无法解码或不是合法 JSON");
}
const CORS_PROXIES=[
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u),
  u=>"https://corsproxy.io/?url="+encodeURIComponent(u)
];
async function fetchProject(url){
  const tries=[{name:"direct",u:url},...CORS_PROXIES.map(p=>({name:"proxy",u:p(url)}))];
  let lastErr=null;
  for(const t of tries){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
      const r=await fetch(t.u,{cache:"no-store",signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const x=jsonAuto(new Uint8Array(await r.arrayBuffer()));
      if(t.name==="proxy")log("代理可用："+t.u.slice(0,80)+"…");
      return x.obj;
    }catch(e){lastErr=e;log((t.name==="proxy"?"代理":"直连")+"获取失败："+t.u.slice(0,80)+"… → "+e.message)}
  }
  throw lastErr||new Error("Failed to fetch");
}

/* ---------- 媒体解析 ---------- */
function isAbs(u){return /^(https?:|blob:|data:)/i.test(u)}
function resolveMedia(raw){
  if(!raw)return null;
  raw=String(raw).trim();
  if(isAbs(raw))return raw;
  if(baseUrl)return new URL(raw,baseUrl).href;
  try{const u=new URL(projectUrl);return new URL(raw,u.origin+"/").href}catch{return raw}
}
function sinkIndex(t){return t.media.replace(/^\/+/,"")}

/* ---------- 校准裁剪 ---------- */
function trimPlan(buffer,stream){
  const delay=(stream&&stream.encoderDelaySamples)||C.ENCODER_DELAY;
  const pad=(stream&&stream.encoderPaddingSamples)||C.ENCODER_PADDING;
  if(!$("trim").checked)return{head:0,tail:0};
  const durSamples=project.durationMs?project.durationMs/1000*buffer.sampleRate:null;
  if(durSamples){
    const untrimmed=Math.abs(buffer.length-durSamples)<=2;
    const already=Math.abs(buffer.length-1-(durSamples-delay-pad))<=2;
    if(already&&!untrimmed){log("  浏览器已自动去 gapless 填充，本次跳过裁剪");return{head:0,tail:0}}
  }
  // 官方 decoder 的 decodedSampleCount = 全部帧×1152；对拍：6643584 = 5767×1152（文件无 Xing/LAME 标签）
  if(stream&&stream.decodedSampleCount&&Math.abs(buffer.length-stream.decodedSampleCount)>2){
    log("  解码长度 "+buffer.length+" ≠ 官方 decodedSampleCount "+stream.decodedSampleCount+"，按比例保守裁剪");
  }
  return{head:delay,tail:pad};
}
async function decodeAudio(ctx,url,stream,retry=3){
  let lastErr=null;
  for(let k=0;k<retry;k++){
    try{
      const r=await fetch(url,{cache:"force-cache"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      let b=await ctx.decodeAudioData(await r.arrayBuffer());
      const p=trimPlan(b,stream);
      if((p.head||p.tail)&&b.length>p.head+p.tail){
        const x=ctx.createBuffer(b.numberOfChannels,b.length-p.head-p.tail,b.sampleRate);
        for(let c=0;c<b.numberOfChannels;c++)
          x.getChannelData(c).set(b.getChannelData(c).subarray(p.head,b.length-p.tail));
        b=x;
      }
      if(b.numberOfChannels!==2){
        const x=ctx.createBuffer(2,b.length,b.sampleRate);
        const L=b.getChannelData(0),R=b.numberOfChannels>1?b.getChannelData(1):L;
        x.getChannelData(0).set(L);x.getChannelData(1).set(R);b=x;
      }
      return b;
    }catch(e){lastErr=e;await new Promise(r=>setTimeout(r,400*(k+1)))}
  }
  throw lastErr||new Error("decode failed");
}
async function fetchFirstOk(urls,stream,ctx){
  let err=null;
  for(const u of urls){
    try{return await decodeAudio(ctx,u,stream)}catch(e){err=e;log("    "+u+" 失败："+e.message)}
  }
  throw err||new Error("no candidate");
}

/* ---------- 预加载 ---------- */
async function preload(){
  const ctx=new AudioContext({sampleRate});
  const list=project.tracks;
  let ok=0, done=0;
  const concurrency=4;
  let idx=0;
  async function worker(){
    while(idx<list.length){
      const i=idx++, t=list[i];
      const rem=resolveMedia(t.media);
      const urls=[rem,(baseUrl||"https://uma.0xcjy.top/")+sinkIndex(t)];
      const st=$("ts-"+i), ue=$("tu-"+i);
      ue.textContent=urls[0]||"(无 URL)";
      try{
        if(!rem)throw new Error("没有可识别的音频 URL");
        st.textContent="载入中";
        const b=await fetchFirstOk(urls.filter(Boolean),t.stream,ctx);
        buffers.set(t.id,b);ok++;
        st.textContent=b.duration.toFixed(3)+" s"+(t.stream&&t.stream.sampleRate!==b.sampleRate?" (⚠ "+b.sampleRate+"Hz)":"");
        st.className="small ok";
      }catch(e){
        st.textContent="失败";st.className="small err";log("轨道 "+t.id+"（"+t.name+"）："+e.message);
      }
      done++;$("loaded").textContent=ok+" / "+list.length;
    }
  }
  await Promise.all(Array.from({length:Math.min(concurrency,list.length)},worker));
  // 依据实测长度校准工程时长（官方 durationMs = 各轨最长者）
  let maxLen=0;
  buffers.forEach(b=>{if(b.length>maxLen)maxLen=b.length});
  const measured=maxLen/sampleRate;
  if(measured>0&&Math.abs(measured-durationSec)>0.004){
    log("实测最长轨 "+maxLen+" 个采样 = "+measured.toFixed(3)+" 秒；工程声明 "+durationSec.toFixed(3)
        +" 秒（可能是默认选角的参考值）→ 采用实测值（与官方口径一致：返回轨道的最长者）");
    durationSec=measured;$("dur").textContent=fmt(durationSec);$("total").textContent=fmt(durationSec);$("seek").max=durationSec;
  }
  await ctx.close();
  log("音频预载完成："+ok+" / "+list.length+" 轨");
}

/* ---------- 加载工程 ---------- */
function validateProject(p){
  if(!p||typeof p!=="object")throw new Error("不是 JSON object");
  if(!Array.isArray(p.tracks))throw new Error("没有 tracks[]");
  const sr=Number(p.sampleRate);
  if(!Number.isFinite(sr)||sr<=0)throw new Error("sampleRate 无效");
  const dur=Number(p.durationMs);
  if(!Number.isFinite(dur)||dur<=0)log("⚠ 工程 durationMs 无效（"+p.durationMs+"），将完全依赖实测音频长度");
  return{sr,dur:Number.isFinite(dur)&&dur>0?dur:0};
}
function keepOrphans(p){
  // 没有 durationMs 时用 0，preload 后会用实测值覆盖
  return Object.assign({},p,{durationMs:p.durationMs||0});
}
async function loadProject(){
  $("load").disabled=true; $("loadLocal").disabled=true;
  $("summary").style.display=$("player").style.display=$("tracksCard").style.display="none";
  buffers.clear(); disconnectGraph();
  try{
    projectUrl=$("projectUrl").value.trim();
    baseUrl=$("baseUrl").value.trim();
    if(baseUrl&&!baseUrl.endsWith("/"))baseUrl+="/";

    const pasted=$("pasteJson").value.trim();
    if(pasted){
      log("使用粘贴的 JSON（跳过网络请求；粘贴框有内容时优先，清空可改用 URL/本地工程）");
      try{project=JSON.parse(pasted)}catch(e){throw new Error("粘贴的 JSON 无法解析: "+e.message)}
    }else if(project&&!projectUrl){
      log("使用生成器直送的工程：" + (project.id||"?"));
    }else{
      if(!projectUrl)throw new Error("请输入 Mixer API URL，或先把生成器里的工程送过来 / 粘贴 JSON");
      project=await fetchProject(projectUrl);
    }
    project=keepOrphans(project);
    const meta=validateProject(project);
    sampleRate=meta.sr; durationSec=meta.dur/1000;

    $("sr").textContent=sampleRate;
    $("dur").textContent=durationSec?fmt(durationSec):"实测";
    $("count").textContent=project.tracks.length;
    $("loaded").textContent="0 / "+project.tracks.length;
    $("balance").textContent=project._uma?(project._uma.balance?"1":"0"):
      (()=>{try{return new URL(projectUrl).searchParams.get("balance")??"-"}catch{return String(project.balance??"-")}})();
    $("total").textContent=durationSec?fmt(durationSec):"--:--";
    $("seek").max=durationSec||1;$("seek").value=0;
    $("summary").style.display=$("player").style.display=$("tracksCard").style.display="";

    const box=$("tracks");box.innerHTML="";
    project.tracks.forEach((t,i)=>{
      const el=document.createElement("div");el.className="track";
      el.innerHTML="<div>"+(i+1)+"</div>"+
        "<div class='name' title='"+esc(t.name||t.id)+"'>"+esc(t.name||t.id)+"</div>"+
        "<div class='url' id='tu-"+i+"' title='"+esc(t.media||"")+"'>"+esc(t.media||"(unknown)")+"</div>"+
        "<div class='small' id='ts-"+i+"'>waiting</div>"+
        "<div class='small'>"+esc(t.volumeDb??0)+" dB</div>";
      box.appendChild(el);
    });

    log("工程："+project.tracks.length+" 轨 / "+sampleRate+" Hz / "+(durationSec?durationSec.toFixed(3)+" 秒":"时长待实测"));
    await preload();
  }catch(e){log("错误："+(e.stack||e));alert(e.message||String(e))}
  finally{$("load").disabled=false;$("loadLocal").disabled=false}
}

/* ---------- 混音图 ---------- */
function schedule(param,pts,map,maxT,smooth){
  param.cancelScheduledValues(0);
  if(!pts.length)return;
  param.setValueAtTime(map(pts[0].v),0);
  for(let i=1;i<pts.length;i++){
    const t=Math.min(maxT,Math.max(0,pts[i].t));
    if(smooth&&t>0)param.setTargetAtTime(map(pts[i].v),t,0.008);
    else param.setValueAtTime(map(pts[i].v),t);
  }
}
function series(arr,key,fallback){
  const a=[{t:0,v:Number(fallback)||0}];
  (arr||[]).forEach(f=>a.push({t:Math.max(0,Number(f.timeMs)||0)/1000,v:Number(f[key]??fallback)}));
  a.sort((x,y)=>x.t-y.t);
  const out=[];
  for(const x of a){if(out.length&&Math.abs(out[out.length-1].t-x.t)<1e-12)out[out.length-1]=x;else out.push(x)}
  return out;
}
function dbGain(db){return db<=-60?0:Math.pow(10,db/20)}
function anySolo(){return project.tracks.some(t=>t.solo)}

function createTrackGraph(ctx,b,t,maxT,smooth){
  const startOffsetSec=((Number(t.startOffsetMs)||0)+(Number(t.timelineStartSample)||0)/sampleRate*1000)/1000;
  const src=ctx.createBufferSource();src.buffer=b;
  const tg=ctx.createGain();
  const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
  const user=ctx.createGain();
  user.gain.value=(t.muted||(anySolo()&&!t.solo))?0:1;

  const vp=series(t.volumeAutomation,"volumeDb",t.volumeDb??0);
  const pp=series(t.pannerAutomation,"panner",t.panner??0);
  schedule(tg.gain,vp,dbGain,maxT,smooth);

  if(pan){ schedule(pan.pan,pp,x=>Math.max(-1,Math.min(1,x)),maxT,smooth); src.connect(tg).connect(pan).connect(user); }
  else { src.connect(tg).connect(user); }
  return{src,last:user,nodes:[tg,pan,user].filter(Boolean),startOffsetSec};
}

function disconnectGraph(){
  for(const g of graph){try{g.src.stop()}catch{}for(const n of g.nodes)try{n.disconnect()}catch{}}
  graph=[];
}
async function ensureRealtime(){
  if(audioCtx)return;
  audioCtx=new AudioContext({sampleRate});
  masterGain=audioCtx.createGain();masterGain.gain.value=.9;
  if($("compress").checked){
    compressor=audioCtx.createDynamicsCompressor();
    compressor.threshold.value=-14;compressor.knee.value=18;compressor.ratio.value=3;
    compressor.attack.value=.01;compressor.release.value=.2;
    masterGain.connect(compressor);compressor.connect(audioCtx.destination);
  }else masterGain.connect(audioCtx.destination);
}
function position(){if(!audioCtx)return pausedAt;return Math.min(durationSec,pausedAt+(audioCtx.currentTime-startedAt))}
function tick(){
  const p=position();
  $("current").textContent=fmt(p);
  if(document.activeElement!==$("seek"))$("seek").value=p;
  if(p>=durationSec-.002&&audioCtx?.state==="running"){pausePlayback();pausedAt=durationSec}
  raf=requestAnimationFrame(tick);
}
async function playPlayback(){
  if(!project)return alert("先加载工程");
  if(!buffers.size)return alert("没有成功加载音频");
  await ensureRealtime();disconnectGraph();
  const start=Math.min(durationSec,Math.max(0,pausedAt));
  const when=audioCtx.currentTime+.05;
  const smooth=true;   // 自动化 8ms 平滑固定开启（官方为阶跃，平滑只影响听感不改变增益数学）
  for(const t of project.tracks){
    const b=buffers.get(t.id);
    if(!b)continue;
    const g=createTrackGraph(audioCtx,b,t,durationSec,smooth);
    g.last.connect(masterGain);graph.push(g);
    const off=start-g.startOffsetSec;
    if(off<0){ try{g.src.start(when-off,0)}catch(e){log("轨道 "+t.id+" 启动失败："+e.message)} continue; }
    if(off>=b.duration)continue;
    try{g.src.start(when,off)}catch(e){log("轨道 "+t.id+" 启动失败："+e.message)}
  }
  startedAt=when;pausedAt=start;
  await audioCtx.resume();
  $("state").textContent="playing";$("play").disabled=true;$("stop").disabled=false;
  cancelAnimationFrame(raf);tick();
}
async function pausePlayback(){
  if(!audioCtx)return;
  pausedAt=position();await audioCtx.suspend();disconnectGraph();
  $("state").textContent="paused";$("play").disabled=false;
}
function stopPlayback(){
  try{audioCtx?.suspend()}catch{}
  disconnectGraph();pausedAt=0;$("seek").value=0;$("current").textContent=fmt(0);
  $("state").textContent="stopped";$("play").disabled=false;
}
async function seekTo(v){
  pausedAt=Math.max(0,Math.min(durationSec,Number(v)));
  $("current").textContent=fmt(pausedAt);
  if(audioCtx?.state==="running")await playPlayback();
}

/* ---------- 导出 ---------- */
async function renderOffline(){
  if(!project||!buffers.size)throw new Error("没有可渲染的工程");
  if(!(durationSec>0))throw new Error("时长未知");
  const frames=Math.ceil(durationSec*sampleRate);
  const off=new OfflineAudioContext(2,frames,sampleRate);
  const master=off.createGain();master.gain.value=.9;
  if($("compress").checked){
    const c=off.createDynamicsCompressor();
    c.threshold.value=-14;c.knee.value=18;c.ratio.value=3;c.attack.value=.01;c.release.value=.2;
    master.connect(c);c.connect(off.destination);
  }else master.connect(off.destination);

  const smooth=true;   // 同上：导出与实时播放口径一致
  let n=0;
  for(const t of project.tracks){
    const b=buffers.get(t.id);
    if(!b)continue;
    const g=createTrackGraph(off,b,t,durationSec,smooth);
    g.last.connect(master);
    if(g.startOffsetSec>0)g.src.start(g.startOffsetSec,0);else g.src.start(0);
    n++;
  }
  $("exportStatus").textContent="渲染 "+n+" 条轨道…";
  const rendered=await off.startRendering();
  $("exportStatus").textContent="编码 WAV…";
  const sixteen=$("wav16").checked;
  const blob=new Blob([audioBufferToWav(rendered,sixteen)],{type:"audio/wav"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=exportBaseName()+".wav";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  $("exportStatus").textContent="完成 "+(blob.size/1048576).toFixed(2)+" MB";
  log("已导出 WAV："+a.download+"（"+(blob.size/1048576).toFixed(2)+" MB，"+(sixteen?"16-bit PCM":"32-bit 浮点")+"）");
}
function exportBaseName(){
  try{
    const h=JSON.parse(localStorage.getItem("uma.handoff")||"null");
    if(h&&h.name)return h.name;
  }catch{}
  if(project&&project._uma&&project._uma.musicId)return "uma-live-"+project._uma.musicId;
  return "uma-render-"+Date.now();
}
function audioBufferToWav(ab,to16){
  const ch=2,sr=ab.sampleRate,n=ab.length;
  if(to16){
    const data=n*ch*2,out=new ArrayBuffer(44+data),d=new DataView(out);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
    w(0,"RIFF");d.setUint32(4,36+data,true);w(8,"WAVE");w(12,"fmt ");
    d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,ch,true);
    d.setUint32(24,sr,true);d.setUint32(28,sr*ch*2,true);d.setUint16(32,ch*2,true);d.setUint16(34,16,true);
    w(36,"data");d.setUint32(40,data,true);
    const L=ab.getChannelData(0),R=ab.getChannelData(1);let p=44;
    const enc=v=>{const x=Math.max(-1,Math.min(1,v));return x<0?x*0x8000:x*0x7FFF};
    for(let i=0;i<n;i++){d.setInt16(p,enc(L[i]),true);p+=2;d.setInt16(p,enc(R[i]),true);p+=2}
    return out;
  }
  const data=n*ch*4,out=new ArrayBuffer(44+data),d=new DataView(out);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");d.setUint32(4,36+data,true);w(8,"WAVE");w(12,"fmt ");
  d.setUint32(16,16,true);d.setUint16(20,3,true);d.setUint16(22,ch,true);
  d.setUint32(24,sr,true);d.setUint32(28,sr*ch*4,true);d.setUint16(32,ch*4,true);d.setUint16(34,32,true);
  w(36,"data");d.setUint32(40,data,true);
  const L=ab.getChannelData(0),R=ab.getChannelData(1);let p=44;
  for(let i=0;i<n;i++){d.setFloat32(p,L[i],true);p+=4;d.setFloat32(p,R[i],true);p+=4}
  return out;
}

/* ---------- 事件 ---------- */
$("load").onclick=loadProject;
$("loadLocal").onclick=()=>{
  try{
    const raw=localStorage.getItem("uma.project");
    if(!raw)return alert("localStorage 里没有工程，请先在生成器页点“送入混音器”");
    project=JSON.parse(raw);
    const h=JSON.parse(localStorage.getItem("uma.handoff")||"{}");
    if(h.mediaBase&&!$("baseUrl").value)$("baseUrl").value=h.mediaBase.endsWith("/")?h.mediaBase:h.mediaBase+"/";
    log("已载入生成器直送的工程："+(project.id||"?")+"（"+(h.name||"")+"）");
    $("projectUrl").value="";
    $("pasteJson").value="";   // 关键：否则粘贴框里残留的 JSON 会静默盖过本地工程
    loadProject();
  }catch(e){alert("载入失败："+e.message)}
};
$("play").onclick=playPlayback;
$("pause").onclick=pausePlayback;
$("stop").onclick=stopPlayback;
$("seek").oninput=e=>{pausedAt=Number(e.target.value);$("current").textContent=fmt(pausedAt)};
$("seek").onchange=e=>seekTo(e.target.value);
$("export").onclick=async()=>{
  $("export").disabled=true;
  try{await renderOffline()}catch(e){$("exportStatus").textContent="失败";log("导出失败："+(e.stack||e));alert(e.message||String(e))}
  finally{$("export").disabled=false}
};

/* ---------- 启动 ---------- */
(function init(){
  const params=new URLSearchParams(location.search);
  const auto=params.get("auto")==="1";
  const FRESH=30*60*1000;                       // 直送信息只在 30 分钟内算“新”
  let handoff=null;
  try{handoff=JSON.parse(localStorage.getItem("uma.handoff")||"null")}catch{}
  const fresh=!!handoff&&handoff.ts&&(Date.now()-handoff.ts)<FRESH;
  /* 提示条只在「本次就是直送跳转（?auto=1）」或「刚直送不到 30 分钟、且用户没关过」时出现。
     注意：uma.handoff 这条**不清掉** —— 导出 WAV 的文件名（exportBaseName）要用里面的 name。 */
  if(handoff&&(auto||(fresh&&!handoff.ack))){
    const el=$("handoff");
    el.style.display="";
    el.innerHTML="已收到生成器直送的工程：<b>"+esc(handoff.name||"?")+"</b>（"+new Date(handoff.ts).toLocaleString()+"）"
      +'<button id="handoffX" type="button" title="关闭提示（已存下的工程与导出文件名不受影响）">×</button>';
    $("handoffX").onclick=()=>{
      handoff.ack=true;
      try{localStorage.setItem("uma.handoff",JSON.stringify(handoff))}catch{}
      el.style.display="none";
    };
    if(!$("baseUrl").value){
      var mb=handoff.mediaBase||"https://uma.0xcjy.top/";
      $("baseUrl").value=mb.endsWith("/")?mb:mb+"/";
    }
  }
  if(auto&&localStorage.getItem("uma.project"))$("loadLocal").click();
  log("混音工具 已就绪");
})();
