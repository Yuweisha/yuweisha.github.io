<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMA Live Studio — 混音工程生成器</title>
<style>
  /* 页眉：与主页 style.css 同一套（sticky 深色条 + 圆头像 + 右侧导航） */
  .site-header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#161b22,#1d232c);border-bottom:1px solid #30363d;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .header-inner{width:min(1280px,calc(100% - 32px));min-height:60px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#f0f6fc}
  .brand-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;background:#0d1117;
    box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 0 3px rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.45);
    transition:transform .18s ease,box-shadow .18s ease}
  .brand:hover .brand-avatar{transform:scale(1.06);box-shadow:0 0 0 1px rgba(255,255,255,.32),0 0 0 3px rgba(9,105,218,.28),0 4px 12px rgba(0,0,0,.5)}
  .brand-name{font-weight:650;font-size:14px;letter-spacing:.2px}
  .brand-sub{color:#8b949e;font-size:12px;font-weight:500}
  .header-nav{margin-left:auto;display:flex;align-items:center;gap:22px}
  .header-nav a{color:#f0f6fc;font-size:14px;font-weight:600;opacity:.9;text-decoration:none;padding:4px 0;transition:opacity .2s,color .2s}
  .header-nav a:hover{color:#fff;opacity:1}
  .header-nav a.on{color:#fff;opacity:1;box-shadow:inset 0 -2px 0 var(--accent)}
  @media(max-width:700px){.header-inner{padding:9px 0}.header-nav{gap:14px}.header-nav a{font-size:13px}.brand-sub{display:none}}


:root{color-scheme:light;--bg:#f6f8fa;--bg-soft:#eef2f6;--panel:#ffffff;--panel2:#f8fafc;--line:#d0d7de;--line-light:#e6ebf0;--text:#1f2328;--text-2:#57606a;--muted:#6e7781;--accent:#0969da;--accent-strong:#0550ae;--accent-soft:#ddf4ff;--ok:#1a7f37;--ok-soft:#dafbe1;--warn:#bc4c00;--warn-soft:#fff1e5;--err:#cf222e;--err-soft:#ffebe9;--shadow-small:0 1px 2px rgba(31,35,40,.06);--shadow:0 3px 8px rgba(31,35,40,.08);--shadow-large:0 8px 24px rgba(31,35,40,.10);--radius-small:6px;--radius:10px;--radius-large:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.wrap{max-width:1360px;margin:auto;padding:24px 18px 60px}
.title{font-size:26px;font-weight:750}
.sub{color:var(--muted);margin:4px 0 18px}
.sub code{background:var(--bg-soft);padding:1px 5px;border-radius:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:minmax(300px,460px) 1fr;gap:14px;align-items:start}
@media(max-width:940px){.cols{grid-template-columns:1fr}}
label{display:block;color:var(--text-2);margin-bottom:6px;font-weight:650}
input[type=search],input[type=text],select{width:100%;padding:9px 11px;background:#ffffff;border:1px solid var(--line);border-radius:8px;color:var(--text);outline:0}
input:focus,select:focus{border-color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:650}
.btn:hover{background:var(--bg-soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--panel)}.btn:disabled{opacity:.45;cursor:not-allowed}
.songlist{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.song{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-light);cursor:pointer}
.song:last-child{border-bottom:0}.song:hover{background:var(--panel2)}
.song.active{background:var(--accent-soft)}
.song img{width:42px;height:42px;border-radius:7px;object-fit:cover;background:var(--bg-soft)}
.song b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .meta{font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg-soft);color:var(--text-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.head{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
.head img{width:132px;height:132px;border-radius:11px;object-fit:cover;background:var(--bg-soft)}
.head h2{margin:2px 0 4px;font-size:20px}
.slot{border:1px solid var(--line);border-radius:11px;padding:10px;margin:9px 0;background:var(--panel2)}
.slot .top{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.slotname{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
/* 关键：作者样式一旦给元素设了 display，就会盖掉浏览器给 hidden 属性的默认样式，
   于是 el.hidden 只改属性、不改渲染（真机上下拉面板常显、点不开也收不起）。这里显式补齐。 */
[hidden]{display:none!important}
.combo{position:relative}
.combo-btn{width:100%;display:flex;gap:9px;align-items:baseline;text-align:left;padding:9px 11px;background:#ffffff;border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;font:inherit;font-weight:650}
.combo-btn:hover{border-color:#8c959f}
.combo-btn:focus-visible{border-color:var(--accent);outline:none}
.combo-btn .cja{color:var(--muted);font-weight:400;font-size:12px}
.combo-btn .caret{margin-left:auto;color:var(--muted);font-weight:400}
.combo-pop{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-large);padding:8px;max-height:340px;display:flex;flex-direction:column}
.combo-search{width:100%;padding:8px 10px;background:#ffffff;border:1px solid var(--line);border-radius:8px;color:var(--text);margin-bottom:6px;font:inherit}
.combo-search:focus{border-color:var(--accent);outline:none}
.combo-list{overflow:auto}
/* 显式排格子：名字块固定左列（左对齐）；wave 标注在右列，缺席时该列自动收为 0 宽 */
.combo-item{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:7px 9px;border-radius:8px;cursor:pointer;align-items:center}
.combo-item .cname{grid-column:1;grid-row:1;text-align:left}
.combo-item .cja{grid-column:1;grid-row:2;text-align:left;color:var(--muted);font-size:12px}
.combo-item .cid{color:var(--muted);font-size:11px}
.combo-item.active{background:var(--accent-soft)}
.combo-item.selected{box-shadow:inset 0 0 0 1px var(--ok)}
.combo-item.selected .cname{color:var(--ok)}
.combo-empty{padding:10px;color:var(--muted);font-size:12px;text-align:center}
.ruler{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:10px 0 2px;font-variant-numeric:tabular-nums;padding-left:102px}
@media(max-width:700px){.ruler{padding-left:0}}
.tl{position:relative;height:16px;background:var(--bg-soft);border:1px solid var(--line-light);border-radius:5px;margin-top:8px;overflow:hidden}
.tl i{position:absolute;top:2px;bottom:2px;background:var(--accent);border-radius:3px;opacity:.92}
.tl u{position:absolute;top:0;bottom:0;width:1px;background:#8c959f;opacity:.5}
pre{margin:0;background:var(--bg);border:1px solid var(--line-light);border-radius:8px;padding:11px;max-height:300px;overflow:auto;color:var(--text);white-space:pre-wrap;font-size:12px}
.note{padding:9px 11px;border-radius:9px;background:var(--ok-soft);border:1px solid #a2d8b4;color:var(--ok);margin:8px 0}
.warn{padding:9px 11px;border-radius:9px;background:var(--warn-soft);border:1px solid #f0b98b;color:var(--warn);margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.head{grid-template-columns:1fr}}
a{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted)}
.kv b{color:var(--text);font-weight:650}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" title="返回 Yuweisha 主页">
      <img class="brand-avatar" src="https://yuweisha.github.io/Storage/mainpageheader.svg" alt="Yuweisha">
      <span class="brand-name">UMA Live Studio</span>
      <span class="brand-sub">混音工程生成器</span>
    </a>
    <nav class="header-nav">
      <a href="generator.html" class="on">生成器</a>
      <a href="mixer.html">混音器</a>
      <a href="index.html">返回主页</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="title">UMA Live Studio · 混音工程生成器
</div>
  <div class="sub">
    根据选择的角色与<strong>本地混音数据</strong>生成混音 JSON 文件，用来产出<strong>特定角色演唱</strong>的 Live。
  </div>

  <div id="boot" class="warn">正在读取本地混音数据…（若长时间无响应请联系作者）</div>

  <div class="cols">
    <div class="card">
      <label for="search">曲目搜索（中文名 / 日文名 / id）</label>
      <input id="search" type="search" placeholder="例如：うまぴょい / 1001 / 特别周">
      <div class="row" style="margin-top:8px">
        <span class="small" id="libStat">—</span>
      </div>
      <div id="songlist" class="songlist"></div>
    </div>

    <div>
      <div class="card" id="songCard" style="display:none">
        <div class="head">
          <img id="cover" alt="">
          <div>
            <h2 id="songTitle">—</h2>
            <div class="small" id="songMeta">—</div>
            <div class="grid2" style="margin-top:10px">
              <div>
                <label for="bgmSelect">BGM</label>
                <select id="bgmSelect"></select>
              </div>
              <div>
                <label>工程时长（留空 = 按当前选角精算）</label>
                <input id="durInput" type="text" inputmode="numeric">
                <div class="small" id="durHint" style="margin-top:5px"></div>
              </div>
            </div>
            <label style="margin-top:10px;display:flex;gap:7px;align-items:center;font-weight:400;color:#b7c4d3">
              <input id="balance" type="checkbox" checked style="accent-color:var(--accent)">
              平衡补偿（voice 增益 ×N<sup>-1/3</sup>，N = 同时在场声部数；与官方 balance=1 一致）
            </label>
          </div>
        </div>

        <div style="margin-top:14px;font-weight:700">声部槽位与角色</div>
        <div class="small">点开任一槽位的下拉即可<strong>搜索角色</strong>（中文名 / 日文名 / id 均可），条目显示中文名、日文名与角色 id，当前选择会高亮。蓝色条为该槽的出场时间轴。</div>
        <div class="ruler" id="ruler"></div>
        <div id="slots"></div>

        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnReset">恢复默认选角</button>
          <button class="btn ghost" id="btnApiUrl">复制官方 API URL（用于核对）</button>
        </div>
      </div>

      <div class="card" id="outCard" style="display:none">
        <div class="row" style="justify-content:space-between">
          <div style="font-weight:700">生成的混音工程 JSON</div>
          <span class="badge" id="outStat">—</span>
        </div>
        <div class="row" style="margin:10px 0">
          <button class="btn primary" id="btnMixer">▶ 送入混音器播放/导出</button>
          <button class="btn" id="btnDownload">下载 JSON</button>
          <button class="btn" id="btnCopy">复制 JSON</button>
          <button class="btn ghost" id="btnCalibrate">实测校准时长（下载音频）</button>
        </div>
        <div id="outMsg" class="small"></div>
        <div class="kv" id="outKv" style="margin:10px 0"></div>
        <pre id="jsonPreview"></pre>
      </div>
    </div>
  </div>

</div>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
